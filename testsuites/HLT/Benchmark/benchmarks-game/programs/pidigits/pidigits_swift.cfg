[prepare]
prepare =
    cp ${SCRIPTS_DIR}/../../benchmarks-game/gmp-6.2.0.tar.xz .
    cp ${SCRIPTS_DIR}/../../benchmarks-game/dependence_codedb.sh .
    bash dependence_codedb.sh -a -j 16
    res=`realpath ./gmp-6.2.0/include/gmp.h`;sed -i "s|replace_me|${res}|" module.map

[compile]
compile = swiftc -Ounchecked -o %n.swift.out %f -I ./ -L ./gmp-6.2.0/lib -lgmp