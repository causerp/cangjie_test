[compile]
compile = cjc --jc-options="+pgo -jprofile=${SCRIPTS_DIR}/OO_jprofs/%n.cj.out.jprof -cleancompilation" --int-overflow wrapping %f -o %n.cj.out

[prepare]
prepare =
 cjc --backend jet --output-type=exe --int-overflow wrapping %f -o %n.cj.out
 JETVMPROP="-Xmx2g -Djet.jprof.dir.path=${SCRIPTS_DIR}/OO_jprofs -Djet.profiler" ./%n.cj.out > /dev/null 2>&1
 cjc --jc-options="+pgo -jprofile=${SCRIPTS_DIR}/OO_jprofs/%n.cj.out.jprof -cleancompilation" --int-overflow wrapping %f -o %n.cj.out
 ./%n.cj.out > /dev/null 2>&1
 ./%n.cj.out > /dev/null 2>&1