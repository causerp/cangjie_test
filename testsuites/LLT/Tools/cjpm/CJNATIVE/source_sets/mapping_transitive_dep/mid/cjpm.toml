[dependencies]
  leaf = { path = "../leaf" }

[package]
  cjc-version = "1.0.0"
  compile-option = ""
  description = "middle module that remaps features onto leaf"
  link-option = ""
  name = "mid"
  output-type = "dynamic"
  target-dir = ""
  version = "1.0.0"

[profile]
  experimental = true

[[feature]]
name = "user.mid.gate"
mapping = [ "user.leaf._1", "user.leaf._2" ]
